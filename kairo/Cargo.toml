[package]
name = "kairo"
version = "0.2.1"
edition = "2021"
default-run = "kairo"
description = "Kairo v2 — local coding agent that asks, plans, edits, and verifies in your repo"
license = "MIT"
repository = "https://github.com/chistym17/kairo"
homepage = "https://kairo.so"
readme = "README.md"
authors = ["chistym17"]
keywords = ["kairo", "agent", "llm", "coding", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/.env",
    "/.env.*",
    "/logs/",
    "/sessions/",
    "/benchmarks/",
    "/target/",
    "/EVAL_FIXTURE.md",
    "/CACHE_VERIFY.md",
    "/imporv.md",
    "/TODO-UX.md",
]

[lib]
name = "kairo"
path = "src/lib.rs"

[[bin]]
name = "kairo"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark"]

[features]
default = []
# Dev/eval only — not installed by `cargo install kairo`.
benchmark = []

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = [
    "json",
    "rustls-tls",
], default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
dotenv = "0.15"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
anyhow = "1"
async-trait = "0.1"
tempfile = "3"
mpatch = "1.6.4"
ratatui = "0.29"
crossterm = "0.28"
