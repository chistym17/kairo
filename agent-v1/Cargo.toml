[package]
name = "agent-v1"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-v1"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = [
    "json",
    "rustls-tls",
], default-features = false }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
dotenv = "0.15"
anyhow = "1"
async-trait = "0.1"
