# Build kairo binaries and attach them to a GitHub Release when a version tag is pushed.
# Example: git tag v0.2.1 && git push origin v0.2.1

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/upload (e.g. v0.2.1). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Intel Mac: cross-compile on Apple Silicon runners (macos-13 queues forever).
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p kairo --bin kairo --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/kairo"
          asset="kairo-${{ matrix.target }}"
          mkdir -p dist/"$asset"
          cp "$bin" dist/"$asset"/kairo
          chmod +x dist/"$asset"/kairo
          tar -C dist -czf "dist/${asset}.tar.gz" "$asset"
          shasum -a 256 "dist/${asset}.tar.gz" | tee "dist/${asset}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairo-${{ matrix.target }}
          path: |
            dist/kairo-${{ matrix.target }}.tar.gz
            dist/kairo-${{ matrix.target }}.tar.gz.sha256

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lah dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: Kairo ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
